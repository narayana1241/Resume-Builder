<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder | My Resumes</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <style>
        /* Toolbar Controls */
        .resumes-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .search-wrapper {
            position: relative;
            min-width: 280px;
        }
        .search-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }
        .search-wrapper input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .search-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .filter-select {
            padding: 10px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            background: #ffffff;
            color: var(--text-muted);
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .filter-select:hover {
            border-color: var(--border-hover);
        }

        /* Resumes Grid */
        .resumes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            margin-bottom: 48px;
        }

        .resume-card {
            background: #ffffff;
            border: 1.5px solid rgba(226, 232, 240, 0.8);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .resume-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(79, 70, 229, 0.15);
        }

        .resume-card-img-box {
            width: 100%;
            aspect-ratio: 1 / 1.414;
            background: #f8fafc;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .resume-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            padding: 16px;
            box-sizing: border-box;
            background: #ffffff;
        }

        .resume-card-info {
            padding: 20px 20px 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .resume-card-info h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .resume-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }
        .resume-card-date {
            font-size: 12px;
            color: var(--text-light);
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 700;
            text-transform: capitalize;
        }
        .status-badge.completed {
            background: #d1fae5;
            color: #065f46;
        }
        .status-badge.progress {
            background: #e0f2fe;
            color: #075985;
        }
        .status-badge.draft {
            background: #fef3c7;
            color: #92400e;
        }

        /* Action Toolbar */
        .resume-card-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 1px solid rgba(226, 232, 240, 0.8);
            background: #fafafa;
        }
        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 12px 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            border-right: 1px solid rgba(226, 232, 240, 0.6);
            background: transparent;
            border-top: none;
            border-left: none;
            border-bottom: none;
        }
        .action-item:last-child {
            border-right: none;
        }
        .action-item i {
            font-size: 14px;
            transition: var(--transition);
        }
        .action-item:hover {
            background: #f1f5f9;
            color: var(--primary);
        }
        .action-item.danger-hover:hover {
            color: var(--danger);
            background: #fee2e2;
        }

        /* Empty State */
        .empty-state {
            background: #ffffff;
            border: 2px dashed var(--border-color);
            border-radius: 20px;
            padding: 48px 32px;
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }
        .empty-icon-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }
        .empty-icon-wrapper i {
            font-size: 36px;
            color: var(--primary);
        }
        .empty-state h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }
        .empty-state p {
            font-size: 14px;
            color: var(--text-light);
            max-width: 400px;
            margin: 0;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .resumes-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .resumes-grid {
                grid-template-columns: repeat(1, 1fr);
            }
            .resumes-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar-left, .toolbar-right {
                width: 100%;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body data-page="myresume">

<div class="container">

    <!-- Sidebar loads dynamically here -->
    <div id="sidebar"></div>

    <!-- Main Content Area -->
    <main class="main-content">
        
        <!-- Premium Header -->
        <header class="saas-header animate-fade">
            <div>
                <h1>My Resumes</h1>
                <p>View, manage, and download your resumes</p>
            </div>
            
            <div class="profile">
                <i class="fa-solid fa-user"></i>
                Welcome, <strong id="username">Guest</strong>
            </div>
        </header>

        <!-- Toolbar Controls -->
        <section class="resumes-toolbar animate-slide">
            <div class="toolbar-left">
                <button class="btn btn-primary" onclick="window.location.href='create_resume.html'">
                    <i class="fa-solid fa-plus"></i> Create New Resume
                </button>
            </div>
            <div class="toolbar-right">
                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="resumeSearch" placeholder="Search by resume name...">
                </div>
                <select id="templateFilter" class="filter-select">
                    <option value="all">All Templates</option>
                </select>
                <select id="sortFilter" class="filter-select">
                    <option value="recent">Sort by: Last Updated</option>
                    <option value="oldest">Sort by: Oldest First</option>
                    <option value="name">Sort by: Name (A-Z)</option>
                </select>
            </div>
        </section>

        <!-- Resumes Grid -->
        <section class="resumes-grid animate-slide" id="resumesGrid">
            <!-- Rendered dynamically -->
        </section>

        <!-- Empty State -->
        <section class="empty-state animate-slide" id="emptyState">
            <div class="empty-icon-wrapper">
                <i class="fa-solid fa-file-invoice"></i>
            </div>
            <h3>Don't see your resume here?</h3>
            <p>Create your first resume and it will appear here.</p>
            <button class="btn btn-primary" onclick="window.location.href='create_resume.html'">
                <i class="fa-solid fa-plus"></i> Create Resume
            </button>
        </section>

    </main>

</div>

<script src="js/common.js"></script>
<script src="js/my_resumes.js"></script>
</body>
</html>
