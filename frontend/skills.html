<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder | Skills</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/skills.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body data-page="create">

<div class="container">

    <!-- Sidebar loads dynamically here -->
    <div id="sidebar"></div>

    <main class="main-content">

        <!-- Dynamic Header -->
        <header class="saas-header animate-fade">
            <div>
                <h1>Resume Builder</h1>
                <p>Create Your Professional Resume</p>
            </div>

            <div class="profile">
                <i class="fa-solid fa-user"></i>
                Welcome, <strong id="username">Guest</strong>
            </div>
        </header>

        <!-- Progress Steps -->
        <div class="steps animate-slide">
            <div class="step completed">
                <span><i class="fa-solid fa-user"></i></span>
                <p>Personal Details</p>
            </div>
            <div class="step completed">
                <span><i class="fa-solid fa-graduation-cap"></i></span>
                <p>Education</p>
            </div>
            <div class="step completed">
                <span><i class="fa-solid fa-briefcase"></i></span>
                <p>Experience</p>
            </div>
            <div class="step active">
                <span><i class="fa-solid fa-code"></i></span>
                <p>Skills</p>
            </div>
            <div class="step">
                <span><i class="fa-solid fa-folder-open"></i></span>
                <p>Projects</p>
            </div>
            <div class="step">
                <span><i class="fa-solid fa-certificate"></i></span>
                <p>Certifications</p>
            </div>
            <div class="step">
                <span><i class="fa-solid fa-eye"></i></span>
                <p>Preview</p>
            </div>
        </div>

        <!-- Skills Card -->
        <div class="saas-card animate-slide">
            
            <div style="margin-bottom: 28px;">
                <h2 style="font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-code" style="color: var(--primary);"></i>
                    Skills
                </h2>
                <p style="font-size: 14px; color: var(--text-light); margin-top: 4px;">Add your technical strengths, tools, and professional skills</p>
            </div>

            <form id="skillsForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="skill_name">Skill Name <span>*</span></label>
                        <input type="text" id="skill_name" class="form-input" placeholder="e.g. Java, React, Figma" required>
                    </div>

                    <div class="form-group">
                        <label for="skill_category">Skill Category</label>
                        <select id="skill_category" class="form-select">
                            <option value="">Select Category</option>
                            <option>Programming Language</option>
                            <option>Database</option>
                            <option>Frontend</option>
                            <option>Backend</option>
                            <option>Framework</option>
                            <option>Cloud</option>
                            <option>DevOps</option>
                            <option>Testing</option>
                            <option>Analytics</option>
                            <option>Soft Skill</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="skill_level">Skill Level</label>
                        <select id="skill_level" class="form-select">
                            <option>Beginner</option>
                            <option>Intermediate</option>
                            <option>Advanced</option>
                            <option>Expert</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="experience_years">Experience (Years)</label>
                        <input type="number" id="experience_years" class="form-input" step="0.5" placeholder="e.g. 2.5">
                    </div>

                </div>

                <div class="form-action-row">
                    <button
                        type="button"
                        id="btnAddSkill"
                        class="btn btn-primary btn-add">
                        <i class="fa-solid fa-plus"></i>
                        Add Skill
                    </button>
                </div>

                <div class="skills-list-section">
                    <h3>Added Skills</h3>
                    
                    <div class="saas-table-container">
                        <table class="saas-table skill-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Skill</th>
                                    <th>Category</th>
                                    <th>Level</th>
                                    <th>Experience</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="skillBody">
                                <!-- Dynamic Skills loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="buttons-row">
                    
                    <button
                        type="button"
                        class="btn btn-secondary btn-back"
                        onclick="window.history.back()">
                        <i class="fa-solid fa-arrow-left"></i>
                        Previous
                    </button>

                    <button
                        type="button"
                        id="btnNext"
                        class="btn btn-primary btn-next">
                        Save & Next
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

<script src="js/common.js"></script>
<script src="js/skills.js"></script>
<script>
    // Set username in header
    window.addEventListener('DOMContentLoaded', () => {
        const fullName = localStorage.getItem("full_name");
        const usernameEl = document.getElementById("username");
        if (fullName && usernameEl) {
            usernameEl.textContent = fullName;
        }
    });
</script>
</body>
</html>
