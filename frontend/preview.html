<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder | Preview Workspace</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/preview.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- html2pdf dependency -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<!-- Top Navigation Toolbar -->
<div class="toolbar animate-fade">
    <div class="toolbar-left">
        <button id="btnBack" class="btn btn-outline">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Editor
        </button>
    </div>
    
    <div class="toolbar-center">
        <h2>Resume Preview Workspace</h2>
    </div>

    <div class="toolbar-right">
        <button id="btnDownload" class="btn btn-primary">
            <i class="fa-solid fa-download"></i>
            Download PDF
        </button>
    </div>
</div>

<!-- Split Workspace Section -->
<div class="split-workspace animate-slide">
    
    <!-- Left Panel: Templates List -->
    <aside class="templates-sidebar" id="templatesSidebar">
        <div class="sidebar-header">
            <h3>Choose Template</h3>
            <p>Switch layouts instantly using your upload details</p>
        </div>
        <div class="sidebar-scroll" id="sidebarTemplatesContainer">
            <!-- Dynamic templates load here -->
        </div>
    </aside>

    <!-- Right Panel: Live Document Renderer -->
    <main class="preview-panel">
        <div class="preview-area">
            <div id="templateContainer" class="paper-preview">
                <!-- Active template content -->
            </div>
        </div>
    </main>

</div>

<!-- Dynamic Template Engine and Loader -->
<script src="templates/template-engine.js"></script>
<script src="templates/template-loader.js"></script>
<script src="js/preview.js"></script>
</body>
</html>
