<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder | Choose Template</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/select_template.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<!-- Sticky Header -->
<header class="gallery-header">
    <div class="header-left">
        <button id="btnBackToEditor" class="btn btn-outline btn-sm">
            <i class="fa-solid fa-arrow-left"></i> Back to Editor
        </button>
        <h2>Choose Template</h2>
    </div>

    <!-- Search & Filter Controls -->
    <div class="header-center">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="templateSearch" placeholder="Search templates by name...">
        </div>
    </div>

    <div class="header-right">
        <div class="filter-badges">
            <button class="filter-badge active" data-filter="all">All</button>
            <button class="filter-badge" data-filter="ats">ATS Friendly</button>
            <button class="filter-badge" data-filter="premium">Premium</button>
        </div>
    </div>
</header>

<!-- Main Gallery Canvas -->
<main class="gallery-container">

    <!-- Color Selector Toolbar (Image 1 "Pick a color") -->
    <div class="color-picker-bar">
        <span class="color-picker-label">
            <i class="fa-solid fa-palette"></i> Pick a color
        </span>

        <div class="color-swatches" id="colorSwatches">
            <button type="button" class="swatch-btn active" data-color="#2563eb" style="background-color: #2563eb;" title="Royal Blue"><i class="fa-solid fa-check"></i></button>
            <button type="button" class="swatch-btn" data-color="#0d9488" style="background-color: #0d9488;" title="Teal"></button>
            <button type="button" class="swatch-btn" data-color="#4f46e5" style="background-color: #4f46e5;" title="Indigo"></button>
            <button type="button" class="swatch-btn" data-color="#7c3aed" style="background-color: #7c3aed;" title="Purple"></button>
            <button type="button" class="swatch-btn" data-color="#db2777" style="background-color: #db2777;" title="Magenta"></button>
            <button type="button" class="swatch-btn" data-color="#dc2626" style="background-color: #dc2626;" title="Red"></button>
            <button type="button" class="swatch-btn" data-color="#ea580c" style="background-color: #ea580c;" title="Orange"></button>
            <button type="button" class="swatch-btn" data-color="#eab308" style="background-color: #eab308;" title="Yellow"></button>
            <button type="button" class="swatch-btn" data-color="#059669" style="background-color: #059669;" title="Emerald"></button>
            <button type="button" class="swatch-btn" data-color="#0284c7" style="background-color: #0284c7;" title="Sky Blue"></button>
            <button type="button" class="swatch-btn" data-color="#475569" style="background-color: #475569;" title="Slate"></button>
            
            <label class="swatch-wheel-label" title="Custom color">
                <input type="color" id="customColorPicker" value="#2563eb">
                <div class="swatch-wheel-btn">
                    <i class="fa-solid fa-arrows-rotate wheel-icon"></i>
                </div>
            </label>
        </div>
    </div>

    <!-- Gallery Grid -->
    <div class="templates-gallery-grid" id="templatesGalleryGrid">
        <!-- Dynamic templates cards render here -->
    </div>
</main>

<!-- JS Scripts -->
<script src="js/select_template.js"></script>
</body>
</html>
